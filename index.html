<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartMoney Real OHLC</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6fb;color:#132033;padding:18px}.app{max-width:1200px;margin:auto}
.top{background:#0b2b57;color:white;padding:24px;border-radius:20px}.card{background:white;margin-top:18px;padding:18px;border-radius:18px;border:1px solid #e5ecf6}
button{padding:12px 16px;border:0;border-radius:12px;font-weight:700;margin:4px;cursor:pointer}.primary{background:#0f6bdc;color:white}.secondary{background:#edf4ff;color:#0f4d9b}
table{width:100%;border-collapse:collapse;background:white}th,td{padding:12px;border-top:1px solid #eee;text-align:left}th{background:#f0f5fb}
.badge{padding:6px 10px;border-radius:999px;font-weight:700}.green{background:#e7f8ef;color:#087443}.orange{background:#fff0e6;color:#b54708}.gray{background:#f2f4f7;color:#667085}
canvas{width:100%;height:420px;border:1px solid #e5ecf6;border-radius:12px}
</style>
</head>
<body><div class="app">
<div class="top"><h1>SmartMoney Real OHLC</h1><p>Render backend connected: https://smartmoney-engine-1e4g.onrender.com</p></div>
<div class="card">
<button class="primary" onclick="updateNow()">Update Real OHLC</button>
<button class="secondary" onclick="loadData()">Load OHLC Data</button>
<div id="status">Ready</div>
</div>
<div class="card"><h2>Dashboard</h2><table><thead><tr><th>Stock</th><th>Signal</th><th>Price</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="card" id="chartBox" style="display:none"><h2 id="chartTitle">Chart</h2><canvas id="chart" width="1100" height="420"></canvas></div>
</div>
<script>
const API="https://smartmoney-engine-1e4g.onrender.com";let stocks=[];
function statusMsg(t){document.getElementById('status').textContent=t}
async function updateNow(){statusMsg('Updating...');const r=await fetch(API+'/api/update-now',{method:'POST'});const d=await r.json();statusMsg(JSON.stringify(d));await loadData();}
async function loadData(){const r=await fetch(API+'/api/ohlc-data');const d=await r.json();stocks=d.stocks||[];render();statusMsg('Loaded '+stocks.length+' stocks');}
function signal(s){let c=s.candles||[];if(c.length<2)return 'NO TRADE';let last=c[c.length-1],first=c[0];return last.close>first.close?'BUY STUDY':last.close<first.close?'SELL STUDY':'NO TRADE'}
function cls(x){return x==='BUY STUDY'?'green':x==='SELL STUDY'?'orange':'gray'}
function render(){rows.innerHTML=stocks.map((s,i)=>`<tr><td><b>${s.symbol}</b><br>${s.name||''}</td><td><span class="badge ${cls(signal(s))}">${signal(s)}</span></td><td>₹${s.candles?.at(-1)?.close||'-'}</td><td><button class="primary" onclick="draw(${i})">Chart</button></td></tr>`).join('')}
function draw(i){let s=stocks[i],c=s.candles||[];chartBox.style.display='block';chartTitle.textContent='Real OHLC Chart — '+s.symbol;let ctx=chart.getContext('2d'),W=chart.width,H=chart.height;ctx.clearRect(0,0,W,H);if(!c.length)return;let vals=[];c.forEach(x=>vals.push(x.high,x.low));let min=Math.min(...vals),max=Math.max(...vals),pad=40;let y=v=>pad+(max-v)/(max-min)*(H-pad*2);let x=i=>pad+i*(W-pad*2)/(c.length-1);c.forEach((k,i)=>{let xx=x(i),yo=y(k.open),yc=y(k.close),yh=y(k.high),yl=y(k.low),bull=k.close>=k.open;ctx.strokeStyle=bull?'#16a34a':'#dc2626';ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(xx,yh);ctx.lineTo(xx,yl);ctx.stroke();ctx.fillRect(xx-4,Math.min(yo,yc),8,Math.max(3,Math.abs(yc-yo)));});chartBox.scrollIntoView({behavior:'smooth'})}
loadData();
</script></body></html>

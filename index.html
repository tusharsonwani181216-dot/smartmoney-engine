<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartMoney Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
body{background:radial-gradient(circle at top left,rgba(15,107,220,.12),transparent 34%),linear-gradient(180deg,#f6f9ff,#edf3fb);color:#071b3a}
.app{max-width:1420px;margin:auto;padding:18px}.hidden{display:none!important}
.loginPage{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071b3a,#0f4d9b)}
.loginCard{width:min(430px,92vw);background:white;border-radius:28px;padding:30px;box-shadow:0 25px 70px rgba(0,0,0,.25)}
.loginCard h1{font-size:32px;margin-bottom:8px}.loginCard p{color:#667085;margin-bottom:18px;line-height:1.45}.loginCard input{width:100%;margin:8px 0 12px}
input,select{padding:13px;border:1px solid #d9e5f2;border-radius:14px;background:#fff;font-size:14px;outline:none}
button{border:none;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer;transition:.18s}button:hover{transform:translateY(-1px)}
.primary{background:linear-gradient(135deg,#0f6bdc,#064ca8);color:white;box-shadow:0 10px 20px rgba(15,107,220,.20)}
.secondary{background:#edf4ff;color:#064ca8}.danger{background:#ffe4e8;color:#b42318}.groww{background:#00b386;color:white}.tv{background:#2962ff;color:white}
.hero{background:linear-gradient(135deg,#071b3a,#0f6bdc);color:white;border-radius:28px;padding:26px;box-shadow:0 18px 45px rgba(7,27,58,.22);display:flex;justify-content:space-between;gap:18px;align-items:center}
.hero h1{font-size:34px;margin-bottom:6px}.hero p{opacity:.92}.userBox{text-align:right;font-size:14px;line-height:1.5}
.card{background:white;border:1px solid #dfeaf7;border-radius:24px;padding:20px;margin-top:18px;box-shadow:0 14px 36px rgba(15,35,70,.08)}
.nav{position:sticky;top:0;z-index:50;background:rgba(243,246,251,.88);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.55);border-radius:24px;padding:12px;display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;box-shadow:0 10px 28px rgba(15,35,70,.08)}
.nav button{background:#edf4ff;color:#064ca8}.nav button.active{background:linear-gradient(135deg,#0f6bdc,#064ca8);color:white}
.page{display:none}.page.active{display:block}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#f8fbff;border:1px solid #e4edf8;border-radius:20px;padding:12px;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:14px}.stat{background:linear-gradient(180deg,#fff,#f4f8ff);border:1px solid #dfeaf7;border-radius:18px;padding:14px;box-shadow:0 10px 24px rgba(15,35,70,.06)}.stat small{color:#64748b;text-transform:uppercase;font-size:11px;font-weight:900;letter-spacing:.4px}.stat b{display:block;font-size:25px;margin-top:6px;color:#061b39}
.tableWrap{overflow-x:auto;border-radius:18px;box-shadow:0 12px 32px rgba(15,35,70,.08);margin-top:14px}table{width:100%;min-width:1120px;border-collapse:collapse;background:white;border-radius:18px;overflow:hidden}th{background:#eaf2fb;color:#21354f;text-align:left;padding:13px;font-size:12px;text-transform:uppercase;letter-spacing:.35px}td{padding:14px;border-top:1px solid #edf2f7;vertical-align:middle}tr:hover td{background:#f8fbff}
.badge{display:inline-block;padding:8px 11px;border-radius:999px;font-weight:950;font-size:12px;white-space:nowrap}.buy{background:#dcfae6;color:#087443}.wait{background:#fff7dc;color:#936200}.avoid{background:#ffe4e8;color:#b42318}.sell{background:#fff0e6;color:#b54708}.blue{background:#e8f2ff;color:#0f4d9b}.gray{background:#eef2f7;color:#475467}
.logo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#0f6bdc,#071b3a);color:white;font-weight:950;box-shadow:0 8px 18px rgba(15,107,220,.20)}
.stockCell{display:flex;align-items:center;gap:10px}.muted{color:#667085;font-size:13px}.scoreBar{height:9px;border-radius:999px;background:#e8eef6;overflow:hidden;margin-top:6px}.scoreFill{height:100%;background:linear-gradient(90deg,#f04438,#fdb022,#12b76a)}
.modeSwitch{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.modeBtn{background:#edf4ff;color:#064ca8}.modeBtn.active{background:linear-gradient(135deg,#0f6bdc,#064ca8);color:white}
.simpleGrid,.gemGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.simpleCard,.panel{background:white;border:1px solid #dfeaf7;border-radius:22px;padding:18px;box-shadow:0 12px 28px rgba(15,35,70,.08);line-height:1.45}.simpleCard h3{font-size:20px;margin-bottom:4px}.infoBox{background:#f8fbff;border:1px solid #e4edf8;border-radius:16px;padding:12px;margin-top:10px;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.chartWrap{background:#fff;border:1px solid #e4edf8;border-radius:18px;padding:14px;overflow:auto;margin-top:14px}canvas{display:block;width:100%;min-width:980px;height:470px}
.levelPanel{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.levelChip{background:#fff;border:1px solid #dbe7f5;border-radius:14px;padding:12px 14px;font-weight:900;line-height:1.3;box-shadow:0 6px 16px rgba(15,35,70,.06)}.levelChip small{display:block;color:#132033;margin-top:4px;font-size:15px}
.actionBtns{display:flex;gap:8px;flex-wrap:wrap}.heatmap{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.heatTile{border-radius:16px;padding:12px;min-height:88px;border:1px solid #e7eef8;cursor:pointer;line-height:1.35}.heatTile strong{font-size:20px;display:block;margin-top:6px}.heatGreen{background:#dcfae6}.heatRed{background:#ffe4e8}.heatYellow{background:#fff7dc}.heatBlue{background:#e8f2ff}
@media(max-width:1000px){.stats,.grid4{grid-template-columns:1fr 1fr}.simpleGrid,.gemGrid,.grid3{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.heatmap{grid-template-columns:repeat(3,1fr)}.hero{display:block}.userBox{text-align:left;margin-top:12px}}
@media(max-width:620px){.app{padding:10px}.stats,.simpleGrid,.gemGrid,.grid3,.grid4{grid-template-columns:1fr}.heatmap{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}.nav{display:grid;grid-template-columns:1fr 1fr}}
</style>

<style>
.loginCard p:empty{display:none}
.hero p:empty{display:none}
.infoBox{background:#f8fbff;border:1px solid #e4edf8;border-radius:16px;padding:12px;margin-top:10px;line-height:1.55}
</style>


<style>
#expertView:not(.hidden), #simpleView:not(.hidden){display:block!important}
.hidden{display:none!important}
button{pointer-events:auto!important}
</style>


<style>
.dateTimeBar{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:14px;
}
.dateTimeCard{
  background:#f8fbff;
  border:1px solid #e4edf8;
  border-radius:18px;
  padding:14px;
  box-shadow:0 8px 20px rgba(15,35,70,.06);
}
.dateTimeCard small{
  display:block;
  color:#64748b;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:5px;
}
.dateTimeCard b{
  font-size:18px;
}
@media(max-width:800px){
  .dateTimeBar{grid-template-columns:1fr}
}
</style>

</head>
<body>
<section id="loginPage" class="loginPage">
  <div class="loginCard">
    <h1>SmartMoney Pro</h1>
    <p></p>
    <input id="loginName" placeholder="Name">
    <input id="loginMobile" placeholder="Mobile / User ID">
    <button class="primary" style="width:100%" onclick="login()">Login</button>
  </div>
</section>

<main id="mainApp" class="app hidden">
  <section class="hero">
    <div><h1>SmartMoney Pro</h1><p>AI Intraday Scanner</p></div>
    <div class="userBox"><b id="userName"></b><br><span id="userId"></span><br><button class="secondary" onclick="logout()">Logout</button></div>
  </section>

  <section class="nav">
    <button class="active" onclick="openPage('dashboard',this)">Dashboard</button>
    <button onclick="openPage('heatmap',this)">Heatmap</button>
    <button onclick="openPage('index',this)">Index</button>
    <button onclick="openPage('group',this)">Group</button>
    <button onclick="openPage('hidden',this)">Hidden Gems</button>
    <button onclick="openPage('option',this)">Option Chain</button>
    <button onclick="openPage('chart',this)">Chart</button>
  </section>

  <section id="dashboard" class="page active card">
    <h2>Dashboard</h2>
    <div class="toolbar">
      <select id="marketSelect"><option value="ALL">NSE + BSE</option><option value="NSE">NSE</option><option value="BSE">BSE</option></select>
      <select id="limitSelect"><option value="30">30 Stocks</option><option value="50">50 Stocks</option><option value="75">75 Stocks</option><option value="100">100 Stocks</option></select>
      <button class="primary" onclick="updateNow()">Update Market</button>
      <button class="secondary" onclick="loadData()">Load Data</button>
      <button class="secondary" id="autoBtn" onclick="toggleAuto()">Auto OFF</button>
      <input id="search" placeholder="Search stock" oninput="renderAll()" style="width:220px">
      <input id="capital" type="number" value="10000" style="width:120px" oninput="saveRisk();renderAll()"><span>Capital</span>
      <input id="riskPct" type="number" value="0.5" style="width:90px" oninput="saveRisk();renderAll()"><span>Risk %</span>
    </div>
    <div class="modeSwitch"><button id="simpleBtn" class="modeBtn active" onclick="setMode('simple')">Simple</button><button id="expertBtn" class="modeBtn" onclick="setMode('expert')">Expert</button></div>
    <div id="dashStats" class="stats"></div>
    <div id="simpleView"></div>
    <div id="expertView" class="hidden"></div>
  </section>

  <section id="heatmap" class="page card"><h2>Live Heatmap</h2><div id="heatmapBox" class="heatmap"></div></section>
  <section id="index" class="page card"><h2>Index Analysis</h2><div class="toolbar"><select id="indexSelect" onchange="renderIndex()"><option value="NIFTY50">NIFTY 50</option><option value="BANKNIFTY">BANK NIFTY</option><option value="FINNIFTY">FINNIFTY</option><option value="SENSEX">SENSEX</option></select></div><div id="indexBox"></div></section>
  <section id="group" class="page card"><h2>Group Analysis</h2><div class="toolbar"><select id="groupSelect" onchange="renderGroup()"><option value="IT">IT</option><option value="AUTO">Auto</option><option value="PHARMA">Pharma</option><option value="BANKNIFTY">Banking</option></select></div><div id="groupBox"></div></section>
  <section id="hidden" class="page card"><h2>Hidden Gems</h2><div id="hiddenBox"></div></section>
  <section id="option" class="page card"><h2>Option Chain AI</h2><div class="toolbar"><select id="optionSelect" onchange="renderOption()"><option value="NIFTY50">NIFTY</option><option value="BANKNIFTY">BANK NIFTY</option><option value="FINNIFTY">FINNIFTY</option></select></div><div id="optionBox"></div></section>
  <section id="chart" class="page card"><h2>Chart</h2><div id="chartBox" class="infoBox">Dashboard se kisi stock ka Chart button dabao.</div></section>
</main>

<script>
const API="https://smartmoney-engine-1e4q.onrender.com";
const SESSION_KEY="sm_professional_user", MODE_KEY="sm_professional_mode", RISK_KEY="sm_professional_risk";
let stocks=[], mode=localStorage.getItem(MODE_KEY)||"simple", autoTimer=null, currentChart=-1;
let risk=JSON.parse(localStorage.getItem(RISK_KEY)||'{"capital":10000,"riskPct":0.5}');
const $=id=>document.getElementById(id), num=v=>isNaN(parseFloat(v))?0:parseFloat(v);
const GROUPS={
NIFTY50:["RELIANCE","TCS","INFY","HDFCBANK","ICICIBANK","SBIN","BHARTIARTL","ITC","LT","AXISBANK","KOTAKBANK","HINDUNILVR","BAJFINANCE","ASIANPAINT","MARUTI","SUNPHARMA","TITAN","ULTRACEMCO","WIPRO","HCLTECH","TECHM","NTPC","POWERGRID","TATASTEEL","JSWSTEEL","ONGC","COALINDIA","ADANIENT","ADANIPORTS","M&M","TATAMOTORS"],
BANKNIFTY:["HDFCBANK","ICICIBANK","SBIN","AXISBANK","KOTAKBANK","INDUSINDBK","BANKBARODA","PNB","FEDERALBNK","AUBANK"],
FINNIFTY:["HDFCBANK","ICICIBANK","SBIN","AXISBANK","KOTAKBANK","BAJFINANCE","BAJAJFINSV","HDFCLIFE","SBILIFE","ICICIPRULI"],
SENSEX:["RELIANCE","TCS","INFY","HDFCBANK","ICICIBANK","SBIN","BHARTIARTL","ITC","LT","AXISBANK","KOTAKBANK","HINDUNILVR","BAJFINANCE","ASIANPAINT","MARUTI","SUNPHARMA","TITAN","ULTRACEMCO","WIPRO","HCLTECH"],
IT:["TCS","INFY","WIPRO","HCLTECH","TECHM","LTIM","MPHASIS","PERSISTENT"],
AUTO:["MARUTI","TATAMOTORS","M&M","EICHERMOT","BAJAJ-AUTO","HEROMOTOCO","TVSMOTOR","ASHOKLEY"],
PHARMA:["SUNPHARMA","CIPLA","DRREDDY","DIVISLAB","APOLLOHOSP","LUPIN","AUROPHARMA","TORNTPHARM"]
};
function login(){localStorage.setItem(SESSION_KEY,JSON.stringify({name:loginName.value||"User",id:loginMobile.value||"Demo"}));showApp()}
function logout(){localStorage.removeItem(SESSION_KEY);location.reload()}
function showApp(){const u=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");if(!u)return;loginPage.classList.add("hidden");mainApp.classList.remove("hidden");userName.textContent=u.name;userId.textContent=u.id;capital.value=risk.capital;riskPct.value=risk.riskPct;setMode(mode);loadData()}
function clean(s){return String(s||"").replace(".NS","").replace(".BO","")}
function fmt(n){return Number(n||0).toFixed(2)}
function avg(a){const b=a.filter(x=>Number.isFinite(Number(x))).map(Number);return b.length?b.reduce((x,y)=>x+y,0)/b.length:0}
function calcRsi(c,p=14){if(c.length<p+1)return 50;let g=0,l=0;for(let i=c.length-p;i<c.length;i++){let d=c[i]-c[i-1];if(d>=0)g+=d;else l-=d}if(l===0)return 70;let rs=g/l;return Math.round((100-(100/(1+rs)))*10)/10}
function metrics(s){const c=s.candles||[];if(!c.length)return null;const last=c[c.length-1],cl=c.map(x=>x.close),hi=c.map(x=>x.high),lo=c.map(x=>x.low),vol=c.map(x=>x.volume||0),price=last.close,vwap=avg(cl.slice(-20)),first=cl[0],support=Math.min(...lo.slice(-20)),resistance=Math.max(...hi.slice(-20)),openingHigh=Math.max(...hi.slice(0,3)),openingLow=Math.min(...lo.slice(0,3)),base=avg(vol.slice(0,Math.max(5,vol.length-5))),spike=base?((avg(vol.slice(-5))-base)/base)*100:0;return{last,price:+fmt(price),vwap:+fmt(vwap),rsi:calcRsi(cl),support:+fmt(support),resistance:+fmt(resistance),trend:price>vwap&&price>first?"Bullish":price<vwap&&price<first?"Bearish":"Range",volumeSpike:+spike.toFixed(1),openingHigh,openingLow}}
function perf(s){const c=s.candles||[];const first=c[0]?.open||0,last=c[c.length-1]?.close||0;return first?((last-first)/first)*100:0}
function analyze(s){const m=metrics(s);if(!m)return{score:0,signal:"WAIT",decision:"WAIT",cls:"wait",m:null,entry:0,sl:0,target:0,qty:0,reason:"No data",rule:"Load data"};let score=50,rs=[];if(m.trend==="Bullish"){score+=14;rs.push("Trend bullish")}if(m.trend==="Bearish"){score-=14;rs.push("Trend bearish")}if(m.price>m.vwap){score+=14;rs.push("VWAP support")}else{score-=12;rs.push("VWAP weakness")}if(m.rsi>=40&&m.rsi<=68){score+=10;rs.push("RSI safe")}else if(m.rsi>72){score-=10;rs.push("RSI high")}if(m.volumeSpike>=15){score+=7;rs.push("Volume active")}else rs.push("Volume normal");if(m.price>m.openingHigh){score+=6;rs.push("Opening breakout")}if(m.price<m.openingLow){score-=6;rs.push("Opening breakdown")}score=Math.max(0,Math.min(96,Math.round(score)));let signal="WAIT",decision="WAIT",cls="wait",rule="Confirmation candle ka wait karo";if(score>=70&&m.price>m.vwap&&m.rsi<72){signal="BUY STUDY";decision="TRADE POSSIBLE";cls="buy";rule="Small quantity + strict SL ke saath entry study"}else if(score>=58&&m.price>m.vwap){signal="BUY STUDY";decision="WAIT CONFIRM";cls="wait";rule="Breakout/volume confirm hone par entry"}else if(score<=42&&m.price<m.vwap){signal="SELL STUDY";decision="BUY AVOID";cls="sell";rule="Buy avoid, weakness hai"}else if(score<35||m.rsi>75){signal="AVOID";decision="AVOID";cls="avoid";rule="Risk high, trade skip"}const entry=m.price,sl=signal==="SELL STUDY"?m.resistance:m.support,target=signal==="SELL STUDY"?m.support:m.resistance,rps=Math.abs(entry-sl),maxRisk=(num(risk.capital)||10000)*(num(risk.riskPct)||0.5)/100,qty=rps?Math.floor(maxRisk/rps):0;return{score,signal,decision,cls,m,entry:+fmt(entry),sl:+fmt(sl),target:+fmt(target),qty,reason:rs.join(" • "),rule,risk:rps?"₹"+Math.round(maxRisk):"-"}}
function sigClass(s){return s==="BUY STUDY"?"buy":s==="SELL STUDY"?"sell":s==="AVOID"?"avoid":"wait"}
function saveRisk(){risk={capital:num(capital.value)||10000,riskPct:num(riskPct.value)||0.5};localStorage.setItem(RISK_KEY,JSON.stringify(risk))}
function setMode(m){mode=m;localStorage.setItem(MODE_KEY,m);simpleBtn.classList.toggle("active",m==="simple");expertBtn.classList.toggle("active",m==="expert");simpleView.classList.toggle("hidden",m!=="simple");expertView.classList.toggle("hidden",m!=="expert");renderDashboard()}
function openPage(id,btn){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");window.scrollTo({top:0,behavior:"smooth"});renderAll()}
function growwUrl(s){return"https://groww.in/search?q="+encodeURIComponent(s.name||clean(s.symbol))}
function tvUrl(s){return"https://www.tradingview.com/chart/?symbol=NSE:"+encodeURIComponent(clean(s.symbol))}
async function loadData(){try{const r=await fetch(API+"/api/ohlc-data");const d=await r.json();stocks=d.stocks||[];renderAll()}catch(e){alert("Backend load fail: "+e.message)}}
async function updateNow(){try{const r=await fetch(API+"/api/update-now",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({market:marketSelect.value,limit:+limitSelect.value})});await r.json();await loadData()}catch(e){alert("Update fail: "+e.message)}}
function toggleAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null;autoBtn.textContent="Auto OFF";autoBtn.className="secondary";return}autoTimer=setInterval(loadData,120000);autoBtn.textContent="Auto ON";autoBtn.className="danger";loadData()}
function filtered(){const q=search.value.toLowerCase();return stocks.map((s,i)=>({s,i,a:analyze(s),p:perf(s)})).filter(x=>(x.s.symbol+" "+(x.s.name||"")).toLowerCase().includes(q)).sort((a,b)=>b.a.score-a.a.score)}
function renderStats(list){dashStats.innerHTML=`<div class="stat"><small>Total</small><b>${list.length}</b></div><div class="stat"><small>Buy Study</small><b>${list.filter(x=>x.a.signal==="BUY STUDY").length}</b></div><div class="stat"><small>Wait</small><b>${list.filter(x=>x.a.signal==="WAIT").length}</b></div><div class="stat"><small>Avoid/Sell</small><b>${list.filter(x=>x.a.signal==="AVOID"||x.a.signal==="SELL STUDY").length}</b></div><div class="stat"><small>Mode</small><b>${mode==="simple"?"Simple":"Expert"}</b></div><div class="stat"><small>Loaded</small><b>${stocks.length}</b></div>`}
function renderDashboard(){saveRisk();const list=filtered();renderStats(list);if(mode==="simple")renderSimple(list);else renderExpert(list)}
function renderSimple(list){simpleView.innerHTML=`<div class="simpleGrid">${list.slice(0,30).map(x=>`<div class="simpleCard"><div class="stockCell"><div class="logo">${clean(x.s.symbol)[0]||"S"}</div><div><h3>${clean(x.s.symbol)}</h3><div class="muted">${x.s.name||""} / ${x.s.market||""}</div></div></div><span class="badge ${x.a.cls}">${x.a.decision}</span><div><b>${x.a.rule}</b></div><div class="infoBox"><b>Entry:</b> ₹${x.a.entry}<br><b>SL:</b> ₹${x.a.sl}<br><b>Target:</b> ₹${x.a.target}<br><b>Score:</b> ${x.a.score}/100<br><b>Perf:</b> <span style="color:${x.p>=0?'#087443':'#b42318'};font-weight:900">${x.p.toFixed(2)}%</span></div><div class="actionBtns" style="margin-top:12px"><button class="primary" onclick="showChart(${x.i})">Chart</button><button class="groww" onclick="window.open('${growwUrl(x.s)}','_blank')">Groww</button><button class="tv" onclick="window.open('${tvUrl(x.s)}','_blank')">TV</button></div></div>`).join("")}</div>`}
function renderExpert(list){expertView.innerHTML=`<div class="tableWrap"><table><thead><tr><th>Stock</th><th>Perf</th><th>Signal</th><th>Score</th><th>Price/VWAP/RSI</th><th>Entry/SL/Target</th><th>Qty/Risk</th><th>Decision</th><th>Action</th></tr></thead><tbody>${list.map(x=>`<tr><td><div class="stockCell"><div class="logo">${clean(x.s.symbol)[0]||"S"}</div><div><b>${clean(x.s.symbol)}</b><br><span class="muted">${x.s.name||""} / ${x.s.market||""}</span></div></div></td><td><b style="color:${x.p>=0?'#087443':'#b42318'}">${x.p.toFixed(2)}%</b></td><td><span class="badge ${sigClass(x.a.signal)}">${x.a.signal}</span></td><td><b>${x.a.score}/100</b><div class="scoreBar"><div class="scoreFill" style="width:${x.a.score}%"></div></div></td><td>₹${x.a.m?.price||"-"}<br>VWAP ₹${x.a.m?.vwap||"-"}<br>RSI ${x.a.m?.rsi||"-"}</td><td>Entry ₹${x.a.entry}<br>SL ₹${x.a.sl}<br>Target ₹${x.a.target}</td><td>Qty ${x.a.qty}<br>Risk ${x.a.risk}</td><td><span class="badge ${x.a.cls}">${x.a.decision}</span><br><span class="muted">${x.a.rule}</span></td><td><div class="actionBtns"><button class="primary" onclick="showChart(${x.i})">Chart</button><button class="groww" onclick="window.open('${growwUrl(x.s)}','_blank')">Groww</button><button class="tv" onclick="window.open('${tvUrl(x.s)}','_blank')">TV</button></div></td></tr>`).join("")}</tbody></table></div>`}

function callPut(list,key){if(!list.length)return null;const avgScore=Math.round(avg(list.map(x=>x.a.score))),avgMove=avg(list.map(x=>x.p)),buy=list.filter(x=>x.a.signal==="BUY STUDY").length,sell=list.filter(x=>x.a.signal==="SELL STUDY"||x.a.signal==="AVOID").length,ce=Math.max(5,Math.min(95,Math.round(50+avgMove*8+(buy-sell)*4))),pe=100-ce,base={NIFTY50:24000,BANKNIFTY:52000,FINNIFTY:22000,SENSEX:80000,IT:36000,AUTO:23000,PHARMA:21000}[key]||24000,spot=Math.round(base*(1+avgMove/100)),step=key==="BANKNIFTY"?100:50,strike=Math.round(spot/step)*step;let decision="NO TRADE / RANGE",cls="wait",reason="Direction clear nahi hai";if(ce>=62&&avgScore>=56){decision="CALL STUDY";cls="buy";reason="Upside strength hai"}else if(pe>=62&&(avgScore<=50||sell>buy)){decision="PUT STUDY";cls="sell";reason="Downside pressure hai"}return{avgScore,avgMove,buy,sell,ce,pe,spot,strike,decision,cls,reason}}

function drawChart(candles,a,m){const canvas=$("candleCanvas"),ctx=canvas.getContext("2d"),W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);let padL=65,padR=92,padT=30,padB=50,vals=[];candles.forEach(c=>vals.push(c.high,c.low));[m.vwap,m.support,m.resistance,a.entry,a.sl,a.target].forEach(v=>vals.push(v));let min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;min-=range*.14;max+=range*.14;const y=v=>padT+(max-v)/(max-min)*(H-padT-padB),x=i=>padL+i*(W-padL-padR)/Math.max(1,candles.length-1);ctx.strokeStyle="#e7eef8";ctx.fillStyle="#667085";ctx.font="12px Arial";for(let g=0;g<=5;g++){let yy=padT+g*(H-padT-padB)/5;ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke();ctx.fillText("₹"+(max-g*(max-min)/5).toFixed(2),W-padR+8,yy+4)}let cw=Math.max(5,(W-padL-padR)/candles.length*.45);candles.forEach((c,i)=>{let xx=x(i),yo=y(c.open),yc=y(c.close),bull=c.close>=c.open;ctx.strokeStyle=bull?"#16a34a":"#dc2626";ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xx,y(c.high));ctx.lineTo(xx,y(c.low));ctx.stroke();ctx.fillRect(xx-cw/2,Math.min(yo,yc),cw,Math.max(3,Math.abs(yc-yo)))});function line(v,color,dash){let yy=y(v);ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2;if(dash)ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke();ctx.restore()}line(m.vwap,"#2563eb",true);line(m.support,"#f59e0b",true);line(m.resistance,"#f59e0b",true);line(a.entry,"#7c3aed");line(a.sl,"#dc2626");line(a.target,"#16a34a")}

<script>
/* TABLE RENDER FIX - NO FALLBACK OVERWRITE */
(function(){
  function byId(id){ return document.getElementById(id); }

  function clearLoadingBox(){
    const simple = byId("simpleView");
    const expert = byId("expertView");
    if(simple && simple.textContent.includes("Data loading")) simple.innerHTML = "";
    if(expert && expert.textContent.includes("Data loading")) expert.innerHTML = "";
  }

  function forceRenderCurrentMode(){
    try{
      clearLoadingBox();
      if(!Array.isArray(window.stocks) || window.stocks.length === 0) return;

      // Use saved/current mode. If Expert button is active, force expert table.
      let currentMode = window.mode || localStorage.getItem("sm_professional_mode") || "simple";
      const expertBtn = byId("expertBtn");
      const simpleBtn = byId("simpleBtn");
      const simpleView = byId("simpleView");
      const expertView = byId("expertView");

      if(expertBtn && expertBtn.classList.contains("active")) currentMode = "expert";
      if(simpleBtn && simpleBtn.classList.contains("active")) currentMode = "simple";

      if(typeof window.filtered !== "function") return;
      const list = window.filtered();

      if(typeof window.renderStats === "function") window.renderStats(list);

      if(currentMode === "expert"){
        window.mode = "expert";
        if(simpleBtn) simpleBtn.classList.remove("active");
        if(expertBtn) expertBtn.classList.add("active");
        if(simpleView) simpleView.classList.add("hidden");
        if(expertView) expertView.classList.remove("hidden");
        if(typeof window.renderExpert === "function") window.renderExpert(list);
      } else {
        window.mode = "simple";
        if(expertBtn) expertBtn.classList.remove("active");
        if(simpleBtn) simpleBtn.classList.add("active");
        if(expertView) expertView.classList.add("hidden");
        if(simpleView) simpleView.classList.remove("hidden");
        if(typeof window.renderSimple === "function") window.renderSimple(list);
      }
    }catch(e){
      console.warn("forceRenderCurrentMode failed", e);
    }
  }

  // override setMode safely
  const oldSetMode = window.setMode;
  window.setMode = function(m){
    window.mode = m;
    localStorage.setItem("sm_professional_mode", m);
    const simpleBtn = byId("simpleBtn");
    const expertBtn = byId("expertBtn");
    const simpleView = byId("simpleView");
    const expertView = byId("expertView");

    if(simpleBtn) simpleBtn.classList.toggle("active", m==="simple");
    if(expertBtn) expertBtn.classList.toggle("active", m==="expert");
    if(simpleView) simpleView.classList.toggle("hidden", m!=="simple");
    if(expertView) expertView.classList.toggle("hidden", m!=="expert");
    forceRenderCurrentMode();
  };

  const oldLoad = window.loadData;
  window.loadData = async function(){
    const btn = document.querySelector('button[onclick="loadData()"]');
    const oldText = btn ? btn.textContent : "";
    if(btn) btn.textContent = "Loading...";
    try{
      if(oldLoad) await oldLoad();
      if(Array.isArray(window.stocks)){
        window.stocks.forEach(s=>{
          if(Array.isArray(s.candles) && s.candles.length > 80) s.candles = s.candles.slice(-80);
        });
      }
      forceRenderCurrentMode();
    }catch(e){
      alert("Data load fail: " + e.message);
    }finally{
      if(btn) btn.textContent = oldText || "Load Data";
    }
  };

  const oldUpdate = window.updateNow;
  window.updateNow = async function(){
    const btn = document.querySelector('button[onclick="updateNow()"]');
    const oldText = btn ? btn.textContent : "";
    if(btn) btn.textContent = "Updating...";
    try{
      if(oldUpdate) await oldUpdate();
      forceRenderCurrentMode();
    }catch(e){
      alert("Update fail: " + e.message);
    }finally{
      if(btn) btn.textContent = oldText || "Update Market";
    }
  };

  const oldRenderAll = window.renderAll;
  window.renderAll = function(){
    try{
      if(oldRenderAll) oldRenderAll();
    }catch(e){}
    setTimeout(forceRenderCurrentMode, 50);
  };

  // Login restore
  const oldLogin = window.login;
  window.login = function(){
    if(oldLogin) oldLogin();
    setTimeout(function(){
      if(typeof window.loadData === "function") window.loadData();
      forceRenderCurrentMode();
    }, 500);
  };

  window.addEventListener("DOMContentLoaded", function(){
    setTimeout(forceRenderCurrentMode, 1200);
    setTimeout(forceRenderCurrentMode, 2500);
  });
})();
</script>


<script>
/* DATE TIME FIX */
(function(){
  function byId(id){ return document.getElementById(id); }

  function istDateTime(){
    const now = new Date();
    return {
      date: now.toLocaleDateString("en-IN", {
        timeZone:"Asia/Kolkata",
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }),
      time: now.toLocaleTimeString("en-IN", {
        timeZone:"Asia/Kolkata",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
      })
    };
  }

  function formatIST(v){
    if(!v) return "-";
    try{
      return new Date(v).toLocaleString("en-IN", {
        timeZone:"Asia/Kolkata",
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
      });
    }catch(e){ return "-"; }
  }

  function ensureDateTimeBar(){
    const dashboard = byId("dashboard");
    if(!dashboard || byId("dateTimeBar")) return;

    const bar = document.createElement("div");
    bar.id = "dateTimeBar";
    bar.className = "dateTimeBar";
    bar.innerHTML = `
      <div class="dateTimeCard">
        <small>Today Date</small>
        <b id="todayDate">-</b>
      </div>
      <div class="dateTimeCard">
        <small>Current Time IST</small>
        <b id="currentTimeIST">-</b>
      </div>
      <div class="dateTimeCard">
        <small>Last Data Update</small>
        <b id="lastDataUpdate">-</b>
      </div>
    `;

    const toolbar = dashboard.querySelector(".toolbar");
    if(toolbar) toolbar.insertAdjacentElement("afterend", bar);
    else dashboard.prepend(bar);
  }

  function updateClock(){
    ensureDateTimeBar();
    const t = istDateTime();
    if(byId("todayDate")) byId("todayDate").textContent = t.date;
    if(byId("currentTimeIST")) byId("currentTimeIST").textContent = t.time;
  }

  const oldLoadData = window.loadData;
  window.loadData = async function(){
    if(oldLoadData) await oldLoadData();
    updateClock();
    try{
      if(Array.isArray(window.stocks) && window.stocks.length && byId("lastDataUpdate")){
        // Try current server updatedAt from already loaded API by fetching only lightweight header data
        fetch("https://smartmoney-engine-1e4q.onrender.com/api/ohlc-data")
          .then(r=>r.json())
          .then(d=>{
            if(byId("lastDataUpdate")) byId("lastDataUpdate").textContent = formatIST(d.updatedAt);
          })
          .catch(()=>{});
      }
    }catch(e){}
  };

  const oldUpdateNow = window.updateNow;
  window.updateNow = async function(){
    if(oldUpdateNow) await oldUpdateNow();
    updateClock();
    if(byId("lastDataUpdate")) byId("lastDataUpdate").textContent = formatIST(new Date().toISOString());
  };

  window.addEventListener("DOMContentLoaded", function(){
    ensureDateTimeBar();
    updateClock();
    setInterval(updateClock, 1000);
  });

  setTimeout(function(){
    ensureDateTimeBar();
    updateClock();
  }, 800);
})();
</script>


<script>
/* ULTRA FAST LOADING PATCH */
(function(){
  const API_BASE = "https://smartmoney-engine-1e4q.onrender.com";
  let fullDataLoaded = false;

  function miniMetrics(s){
    const price = Number(s.price||0);
    const vwap = Number(s.vwap||0);
    const support = Number(s.low||0);
    const resistance = Number(s.high||0);
    const perf = s.open ? ((price - Number(s.open)) / Number(s.open)) * 100 : 0;
    return {
      price, vwap, support, resistance,
      rsi: price > vwap ? 58 : 42,
      trend: price > vwap ? "Bullish" : price < vwap ? "Bearish" : "Range",
      volumeSpike: 0,
      openingHigh: resistance,
      openingLow: support,
      perf
    };
  }

  window.metrics = function(s){
    if(!s) return null;
    if(Array.isArray(s.candles) && s.candles.length){
      const c=s.candles.slice(-60);
      const last=c[c.length-1], cl=c.map(x=>x.close), hi=c.map(x=>x.high), lo=c.map(x=>x.low), vol=c.map(x=>x.volume||0);
      const avg=a=>a.filter(x=>Number.isFinite(Number(x))).map(Number).reduce((x,y,i,arr)=>x+y/arr.length,0);
      const price=Number(last.close||0), vwap=Number(avg(cl.slice(-20)).toFixed(2));
      return {
        last,
        price:+price.toFixed(2),
        vwap,
        rsi: price>vwap?58:42,
        support:+Math.min(...lo.slice(-20)).toFixed(2),
        resistance:+Math.max(...hi.slice(-20)).toFixed(2),
        trend: price>vwap?"Bullish":price<vwap?"Bearish":"Range",
        volumeSpike:0,
        openingHigh:Math.max(...hi.slice(0,3)),
        openingLow:Math.min(...lo.slice(0,3))
      };
    }
    return miniMetrics(s);
  };

  window.perf = function(s){
    if(Array.isArray(s.candles) && s.candles.length){
      const c=s.candles.slice(-60);
      const first=c[0]?.open||0,last=c[c.length-1]?.close||0;
      return first?((last-first)/first)*100:0;
    }
    return miniMetrics(s).perf || 0;
  };

  const oldLoadData = window.loadData;
  window.loadData = async function(){
    const btn = document.querySelector('button[onclick="loadData()"]');
    const oldText = btn ? btn.textContent : "";
    try{
      if(btn) btn.textContent = "Fast Loading...";
      const r = await fetch(API_BASE + "/api/summary-data", {cache:"no-store"});
      if(!r.ok) throw new Error("summary endpoint not ready");
      const d = await r.json();
      window.stocks = d.stocks || [];
      fullDataLoaded = false;
      if(typeof window.renderAll === "function") window.renderAll();
      const last = document.getElementById("lastDataUpdate");
      if(last && d.updatedAt){
        last.textContent = new Date(d.updatedAt).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",hour12:true});
      }
    }catch(e){
      if(oldLoadData) await oldLoadData();
    }finally{
      if(btn) btn.textContent = oldText || "Load Data";
    }
  };

  const oldShowChart = window.showChart;
  window.showChart = async function(i){
    if(!fullDataLoaded || !window.stocks[i]?.candles){
      const box = document.getElementById("chartBox");
      if(box) box.innerHTML = '<div class="infoBox"><b>Chart loading...</b></div>';
      try{
        const r = await fetch(API_BASE + "/api/ohlc-data", {cache:"no-store"});
        const d = await r.json();
        const full = d.stocks || [];
        window.stocks = window.stocks.map((s,idx)=>Object.assign({}, s, full[idx] || {}));
        window.stocks.forEach(s=>{
          if(Array.isArray(s.candles) && s.candles.length>80) s.candles=s.candles.slice(-80);
        });
        fullDataLoaded = true;
      }catch(e){
        alert("Chart data load fail: " + e.message);
        return;
      }
    }
    if(oldShowChart) oldShowChart(i);
  };

  window.addEventListener("DOMContentLoaded", function(){
    setTimeout(()=>{ if(typeof window.loadData==="function") window.loadData(); }, 300);
  });
})();
</script>

</body>
